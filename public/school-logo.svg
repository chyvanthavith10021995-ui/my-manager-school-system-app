<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Ring Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fde047" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Outer Shadowed Emblem Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Gold Decorative Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="14 6" opacity="0.8" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Sun Rays / Torch Glow behind book -->
  <g opacity="0.25" stroke="#fef08a" stroke-width="3">
    <line x1="256" y1="256" x2="256" y2="70" />
    <line x1="256" y1="256" x2="387" y2="125" />
    <line x1="256" y1="256" x2="442" y2="256" />
    <line x1="256" y1="256" x2="125" y2="125" />
    <line x1="256" y1="256" x2="70" y2="256" />
  </g>

  <!-- Crown / Star Light of Wisdom at top -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <polygon points="0,-28 8,-8 28,-8 12,4 18,24 0,12 -18,24 -12,4 -28,-8 -8,-8" fill="url(#goldGrad)" />
  </g>
  <circle cx="256" cy="120" r="6" fill="#ffffff" />

  <!-- Open Book Base & Shadow -->
  <g transform="translate(256, 280)" filter="url(#shadow)">
    <!-- Left Cover -->
    <path d="M-130,20 Q-60,0 0,35 L0,55 Q-60,20 -130,40 Z" fill="#b91c1c" />
    <!-- Right Cover -->
    <path d="M130,20 Q60,0 0,35 L0,55 Q60,20 130,40 Z" fill="#991b1b" />

    <!-- Left Book Pages -->
    <path d="M-125,-60 Q-60,-80 0,-40 L0,30 Q-60,-10 -125,-10 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Right Book Pages -->
    <path d="M125,-60 Q60,-80 0,-40 L0,30 Q60,-10 125,-10 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Book Spine Divider -->
    <path d="M0,-45 L0,33" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Text / Line details on pages -->
    <!-- Left Page Lines -->
    <line x1="-100" y1="-42" x2="-25" y2="-28" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="-100" y1="-26" x2="-25" y2="-12" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="-100" y1="-10" x2="-25" y2="4" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="-100" y1="6" x2="-45" y2="16" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Right Page Lines -->
    <line x1="25" y1="-28" x2="100" y2="-42" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="25" y1="-12" x2="100" y2="-26" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="25" y1="4" x2="100" y2="-10" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="45" y1="16" x2="100" y2="6" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Torch / Flame Symbol of Education Above Book -->
  <g transform="translate(256, 195)" filter="url(#glow)">
    <!-- Torch Handle -->
    <path d="M-6,30 L6,30 L4,55 L-4,55 Z" fill="url(#goldGrad)" />
    <!-- Torch Cup -->
    <path d="M-14,28 Q0,38 14,28 L10,14 L-10,14 Z" fill="url(#goldGrad)" />
    <!-- Inner Flame -->
    <path d="M0,14 Q-14,0 -6,-24 Q0,-38 0,-42 Q10,-24 6,-14 Q14,-4 0,14 Z" fill="#ef4444" />
    <path d="M0,12 Q-8,0 -3,-16 Q0,-26 0,-30 Q6,-16 4,-8 Q8,-2 0,12 Z" fill="#f97316" />
    <path d="M0,10 Q-4,2 -1,-8 Q0,-16 0,-20 Q3,-10 2,-4 Q4,0 0,10 Z" fill="#fde047" />
  </g>

  <!-- Bottom Banner Ribbon -->
  <g transform="translate(256, 415)" filter="url(#shadow)">
    <!-- Ribbon Tails -->
    <path d="M-180,10 L-130,-15 L-130,25 L-180,35 Z" fill="#1e3a8a" />
    <path d="M180,10 L130,-15 L130,25 L180,35 Z" fill="#1e3a8a" />
    
    <!-- Ribbon Main Body -->
    <path d="M-145,-15 Q0,-35 145,-15 Q155,15 145,25 Q0,5 0,5 Q0,5 -145,25 Q-155,15 -145,-15 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="2" />
    
    <!-- Ribbon Text (MoEYS) -->
    <text x="0" y="7" font-family="'Siemreap', 'Moul', sans-serif" font-weight="900" font-size="20" fill="#1e1b4b" text-anchor="middle" letter-spacing="3">
      MoEYS • សាលាបឋមសិក្សា
    </text>
  </g>
</svg>
